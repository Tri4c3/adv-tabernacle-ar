<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Museo AR</title>
  <script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer/dist/model-viewer.min.js"></script>
  <style>
    body { margin:0; font-family: sans-serif; }
    h1 { padding: 12px 16px; font-size: 20px; margin: 0; }
    model-viewer { width: 100%; height: 75vh; }
    button { padding: 12px 20px; font-size: 16px; }
  </style>
</head>
<body>
  <h1>Altar del Sacrificio</h1>
 <model-viewer
  src="01.glb"
  ios-src="01.usdz"
  alt="Altar_holocausto"
  ar
  ar-modes="webxr scene-viewer quick-look"
  ar-scale="fixed"
  ar-placement="floor"
  camera-controls>
  <button slot="ar-button">Ver en tu espacio</button>
</model-viewer>
  <p style="padding:0 16px">© Tu nombre. Prohibida su reproducción.</p>
</body>
</html>
